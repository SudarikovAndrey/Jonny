<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Америкэн бой — Сан-Франциско на 2–4</title>
<style>html,body{margin:0;height:100%;background:#24221e;color:#f2e3bd;font:600 15px Georgia,serif}p{margin:0;padding:40px 20px;text-align:center}</style></head>
<body><p id="mpBoot">Загружаем стол…</p>
<script>
// Вход в мультиплеер «Сан-Франциско» (черновики/америкэн-бой-мультиплеер.md).
// Общая сборка (tools/build_mobile.py, index.html) о мультиплеере не знает: эта страница берёт
// свежий index.html и вставляет web/mp-core.js и web/mp.js в его встроенный скрипт перед запуском
// партии — туда же, где стоят остальные режимы (после sf-builder.js). Так модули не попадают
// в общий index.html, пока не закоммичены.
(async()=>{
  const q=new URLSearchParams(location.search);
  if(!q.has('mp')||q.get('map')!=='sf'){if(!q.has('mp'))q.set('mp','');q.set('map','sf');history.replaceState(null,'','?'+q.toString().replace(/mp=(&|$)/,'mp$1'));}
  // Подпись каждого файла (ETag, иначе дата+размер) — mp.js сверяет её с сервером: открытый до выкладки стол видит, что вышла новая версия.
  const sig={},sigOf=r=>r.headers.get('etag')||((r.headers.get('last-modified')||'')+'/'+(r.headers.get('content-length')||''));
  const get=u=>fetch(u+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);sig[u]=sigOf(r);return r.text();});
  try{
    // Боты — на любом столе у хозяина (backlog 02.10: «пропала возможность выбирать ботов»); панель механик в mp-test.js — только при ?test=1.
    const [html,core,mp,rules,tst]=await Promise.all([get('index.html'),get('mp-core.js'),get('mp.js'),get('mp-rules.js').catch(()=>''),get('mp-test.js').catch(()=>'')]);
    const anchor='const startAskName=askName',i=html.indexOf(anchor);
    if(i<0)throw new Error('в index.html нет точки запуска партии');
    let h=5381;const src=core+mp;for(let k=0;k<src.length;k++)h=((h<<5)+h+src.charCodeAt(k))|0;   // версия мультиплеера — для логов
    let v=5381;const all=html+core+mp+rules;for(let k=0;k<all.length;k++)v=((v<<5)+v+all.charCodeAt(k))|0;   // версия всей сборки: страница + модули партии
    const ver={id:(v>>>0).toString(36).slice(-6),sig};
    document.open();document.write(html.slice(0,i)+core+'\n'+mp+'\n'+rules+'\n'+tst+'\nwindow.AB_MP_BUILD="'+(h>>>0).toString(36)+'";window.AB_VER='+JSON.stringify(ver)+';\n'+html.slice(i));document.close();
  }catch(e){document.getElementById('mpBoot').textContent='Не удалось открыть стол: '+e.message;console.error(e);}
})();
</script></body></html>
