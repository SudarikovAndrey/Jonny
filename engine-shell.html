<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
html,body,canvas{margin:0;width:100%;height:100%;display:block;overflow:hidden;background:#b1a087}canvas:focus{outline:none}
</style></head><body><canvas id="canvas"></canvas><script src="$GODOT_URL"></script><script>
const engine = new Engine($GODOT_CONFIG);
engine.startGame({canvas:document.getElementById('canvas'),canvasResizePolicy:2,onProgress:(n,total)=>{
 if(parent.MobileHost)parent.MobileHost.progress(total?Math.round(n/total*100):0);
}}).catch(error=>{console.error(error);if(parent.MobileHost)parent.MobileHost.failed(String(error));});
</script></body></html>
