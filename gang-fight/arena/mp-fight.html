<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Драка за точку</title>
<!-- Окно драки банды (МП «С бойцами»): общая арена (снимок выпуска — tools/build_gang_fight.py), исход задаёт стол
     (web/mp-gang.js battle). Две панели сторон (Андрей 28.10: «идёт название игрока, рядом карточки… с одной стороны,
     с другой стороны»): нападение — бумажный лист слева сверху, защита — справа снизу, в каждом имя игрока и его бойцы
     (портрет, уровень, здоровье; выбывший переворачивается). Панели по содержимому — на ПК не растягиваются. -->
<style>
@font-face{font-family:'Bitter';font-weight:700;src:url(../../assets/fonts/bitter-700-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F,U+2116}
@font-face{font-family:'Bitter';font-weight:700;src:url(../../assets/fonts/bitter-700-latin.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:'Bitter';font-weight:800;src:url(../../assets/fonts/bitter-800-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F,U+2116}
@font-face{font-family:'Bitter';font-weight:800;src:url(../../assets/fonts/bitter-800-latin.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:'Golos Text';font-weight:700;src:url(../../assets/fonts/golos-text-700-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F,U+2116}
@font-face{font-family:'Golos Text';font-weight:700;src:url(../../assets/fonts/golos-text-700-latin.woff2) format('woff2');unicode-range:U+0000-00FF}
:root{--ink:#25221c;--paper:#f2e3bd;--paper2:#e9d8ae;--att:#2f5d73;--def:#c99a32;--blue:#2f5d73;--gold:#a8802a;--red:#a92720;--card-w:46px;--card-h:60px;
 --num:'Golos Text',Arial,sans-serif;--txt:'Bitter',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d4be91;color:var(--ink);font:14px Bitter,Georgia,serif}
/* Сцена на весь экран; карточки лежат поверх низа кадра (на телефоне там пустой край двора). */
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#badges{position:absolute;inset:0;pointer-events:none;z-index:2}
#badges .badge{position:absolute;visibility:hidden}   /* полоски над головами не нужны — здоровье на карточках */
#badges .combat-notice{position:absolute;transform:translate(-50%,-100%);font:700 11px/1 Georgia,serif;white-space:nowrap;pointer-events:none;color:var(--paper);text-shadow:0 1px 1px var(--ink),1px 0 1px var(--ink),-1px 0 1px var(--ink);z-index:3}
#badges .combat-notice.crit{color:#efc875}
#badges .damage-number{position:absolute;transform:translate(-50%,-100%);font:800 12px/1 Georgia,serif;color:var(--paper);text-shadow:0 1px 1px var(--ink),1px 0 1px var(--ink),-1px 0 1px var(--ink);pointer-events:none}
#badges .damage-number.critical{color:#efc875;font-size:14px}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:700 16px Bitter,Georgia,serif;background:#d4be91;z-index:5}
#loading.hidden{display:none}
/* Панель стороны: печатный лист — бумага с зерном, тушевой контур с неровными углами, печатная тень, тонкая
   внутренняя рамка «оттиска». Бирка стороны цветом команды, имя игрока крупно, под ним бойцы этого игрока. */
.mpf-panel{position:fixed;z-index:4;display:grid;gap:6px;padding:7px 10px 9px;max-width:calc(100% - 16px);pointer-events:none;
 background:var(--paper) url(../../assets/paper-grain.svg);border:2.5px solid var(--ink);border-radius:11px 9px 12px 8px;box-shadow:0 3px 0 var(--ink)}
.mpf-panel::before{content:'';position:absolute;inset:3px;border:1px solid rgba(37,34,28,.22);border-radius:8px 7px 9px 6px;pointer-events:none}
.mpf-panel.att{left:calc(8px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top))}
.mpf-panel.def{right:calc(8px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom))}
.mpf-head{display:flex;align-items:center;gap:7px;min-width:0}
.mpf-tag{flex:none;padding:2px 6px 1px;border:1.5px solid var(--ink);border-radius:4px 5px 4px 6px;font:800 10.5px/1.1 var(--txt);letter-spacing:.7px;text-transform:uppercase}
.att .mpf-tag{background:var(--att);color:#f2e3bd}.def .mpf-tag{background:var(--def);color:var(--ink)}
.mpf-name{min-width:0;font:700 17px/1.1 var(--num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Победитель — резиновая печать на краю панели (нижнем у нападения, верхнем у защиты): места у имени не занимает. */
.mpf-panel.win::after{content:'победа';position:absolute;right:14px;padding:1px 8px 2px;background:var(--paper);border:2px solid var(--red);border-radius:5px 4px 6px 4px;color:var(--red);font:800 13px/1.3 var(--txt);text-transform:uppercase;letter-spacing:.6px;box-shadow:0 2px 0 rgba(37,34,28,.35)}
.mpf-panel.att.win::after{bottom:-14px;transform:rotate(-5deg)}.mpf-panel.def.win::after{top:-14px;transform:rotate(4deg)}
.mpf-team{display:flex;flex-wrap:nowrap;gap:7px;padding-top:7px}   /* сверху — место для кружков уровня */
.fc{position:relative;width:var(--card-w);height:var(--card-h);perspective:240px;flex:none}
.fc-in{position:absolute;inset:0;transform-style:preserve-3d;transition:none}
.fc-face,.fc-back{position:absolute;inset:0;border:2px solid var(--ink);border-radius:8px;box-shadow:0 2px 0 var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.fc-face{background:var(--paper) url(../../assets/paper-grain.svg)}
.fc-face img{position:absolute;inset:2px 2px 9px;width:calc(100% - 4px);height:calc(100% - 11px);object-fit:cover;border-radius:5px}
.fc.blue .fc-face{border-color:var(--att)}.fc.gold .fc-face{border-color:#8a6a1f}
/* Кружок уровня — на карточке, а не в лицевой стороне (у неё обрезка по краю); при перевороте уходит вместе с лицом. */
.fc-lv{position:absolute;left:-7px;top:-7px;z-index:3;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(1px);min-width:20px;height:20px;padding:0 3px;border:2px solid var(--ink);border-radius:10px;background:#e0b14a;font:900 12px/16px Bitter,Georgia,serif;text-align:center}
.fc-hp{position:absolute;left:3px;right:3px;bottom:2px;height:5px;border-radius:3px;background:rgba(37,34,28,.3);overflow:hidden}
.fc-hp i,.fc-hp b{position:absolute;left:0;top:0;bottom:0;transform-origin:left;width:100%}
.fc-hp i{background:#e9c58a}                /* «след» удара догоняет полоску */
.fc-hp b{background:#3f7a4a}
.fc.low .fc-hp b{background:var(--red)}
.fc-back{transform:rotateY(180deg);background:#3a3226;display:grid;place-items:center}
/* Рубашка выбывшего: красный чернильный крест и мелкая подпись. */
.fc-back::before,.fc-back::after{content:'';position:absolute;left:50%;top:42%;width:26px;height:4px;margin:-2px 0 0 -13px;border-radius:2px;background:#c24a3a;transform:rotate(45deg)}
.fc-back::after{transform:rotate(-45deg)}
.fc-back span{position:absolute;left:0;right:0;bottom:5px;text-align:center;font:800 7.5px/1 Bitter,Georgia,serif;color:#f2c6b8}
.fc.out .fc-lv{visibility:hidden}
.fc.hit .fc-in{animation:fc-hit .17s steps(2) 1}
@keyframes fc-hit{0%{translate:-2px 0}50%{translate:2px 1px}100%{translate:0 0}}
/* Выбыл: упреждение — присел, затем переворот с перелётом и мягкой посадкой рубашкой вверх. */
.fc.out .fc-in{transform:rotateY(180deg)}
.fc.flip .fc-in{animation:fc-flip .62s 1 both}
@keyframes fc-flip{
 0%{transform:rotateY(0) translateY(0) scale(1);animation-timing-function:cubic-bezier(.3,0,.6,1)}
 14%{transform:rotateY(-8deg) translateY(2px) scale(.94,.9);animation-timing-function:cubic-bezier(.2,.8,.3,1)}
 62%{transform:rotateY(196deg) translateY(-8px) scale(1.06);animation-timing-function:cubic-bezier(.4,0,.6,1)}
 84%{transform:rotateY(176deg) translateY(1px) scale(.97,1.03)}
 100%{transform:rotateY(180deg) translateY(0) scale(1)}}
/* «Пропустить» — отдельная бумажная кнопка в свободном углу (справа сверху), касание 44 px. */
#skip{position:fixed;right:calc(8px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));z-index:5;min-height:44px;padding:0 14px;
 font:800 14px var(--txt);color:var(--ink);background:var(--paper2) url(../../assets/paper-grain.svg);border:2.5px solid var(--ink);border-radius:9px 11px 8px 10px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
#skip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#verdict{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-3deg);z-index:4;padding:6px 18px 7px;background:var(--paper) url(../../assets/paper-grain.svg);border:2.5px solid var(--ink);border-radius:10px 12px 9px 11px;box-shadow:0 3px 0 var(--ink);font:800 24px var(--txt);white-space:nowrap}
#verdict[hidden]{display:none}
/* ПК: крупнее — имя и карточки читаются издалека; панели по-прежнему по содержимому. */
@media (min-width:900px){:root{--card-w:56px;--card-h:72px}.mpf-name{font-size:20px}.mpf-tag{font-size:12px}.mpf-team{gap:9px}.fc-lv{min-width:23px;height:23px;font-size:13px;line-height:19px}.fc-hp{height:6px}#skip{font-size:15px}}
/* Телефон: карточки поменьше, панель нападения не заезжает под «Пропустить». */
@media (max-width:520px){:root{--card-w:40px;--card-h:52px}.mpf-team{gap:6px}.mpf-panel.att{max-width:calc(100% - 132px)}.mpf-name{font-size:16px}}
@media (prefers-reduced-motion:reduce){.fc.flip .fc-in,.fc.hit .fc-in{animation:none}}
</style>
<script type="importmap">{"imports":{"three":"../viewer/vendor/three.module.js","cannon-es":"../viewer/vendor/cannon-es.js"}}</script>
</head><body>
<section id="stage"><canvas></canvas><div id="badges" aria-hidden="true"></div></section>
<div id="loading">Бойцы подтягиваются во двор…</div>
<section class="mpf-panel att" aria-label="Нападение"><div class="mpf-head"><span class="mpf-tag">Нападение</span><b class="mpf-name" id="nameAtt"></b></div><div class="mpf-team blue" id="cardsBlue"></div></section>
<section class="mpf-panel def" aria-label="Защита"><div class="mpf-head"><span class="mpf-tag">Защита</span><b class="mpf-name" id="nameDef"></b></div><div class="mpf-team gold" id="cardsGold"></div></section>
<div id="verdict" hidden></div>
<button id="skip" type="button">Пропустить</button>
<script type="module" src="./mp-fight.mjs?v=20261029j"></script>
</body></html>
