<!doctype html><meta charset="utf-8"><title>MP fight integration review</title><body style="background:#333;color:white"><p id="status">Waiting for ready</p><iframe id="fight" title="Mobile multiplayer fight" style="width:390px;height:844px;border:0"></iframe><script>
const spec={blue:[0,2,4,6].map((kind,i)=>({id:'b'+i,kind,lvl:3})),gold:[1,3,5].map((kind,i)=>({id:'g'+i,kind,lvl:3})),win:0,survivors:['b0','b1','b2','b3'],left:{b0:.5,b1:.5,b2:.5,b3:.5},mute:true};
const frame=document.querySelector('iframe');frame.src='../arena/mp-fight.html?mute#'+encodeURIComponent(JSON.stringify(spec));let ready=false;window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data.type!=='gang-fight')return;if(e.data.ready)ready=true;document.querySelector('#status').textContent=e.data.done?'PASS: ready='+ready+', done=true, skipped='+e.data.skipped:'READY: seven-character fight loaded';});</script>
