:root{--disp:'Suisse Intl',Arial,sans-serif;--bg:#2f2c28;--panel:#3a352f;--cream:#efe4cc;--cream2:#e3d6b8;--ink:#2a221c;--mut:#6b5f52;--red:#c9432f;--red2:#a83422;--green:#3f8f4c;--gold:#e0a52a;--line:#d6c8a8;--txt:#efe4cc}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.35 'Suisse Intl',-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;margin:0 auto;position:relative}
#top>*{width:100%;max-width:520px}
#top,#panel,#inv,#tip,#toast{zoom:var(--ui,1)}.nozoom #top,.nozoom #panel,.nozoom #inv,.nozoom #tip,.nozoom #toast{zoom:1}
.card{zoom:1}
#toast .tico{width:44px;height:44px;border-radius:12px;background:#2a221c14;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto}#toast .ttxt{flex:1;min-width:0;text-align:left}
#top{position:absolute;left:0;right:0;top:0;z-index:35;padding:6px 8px 0;display:flex;flex-direction:column;gap:5px;pointer-events:none;align-items:center}
.bar0{display:flex;gap:8px;align-items:center;justify-content:center;width:100%}
.ava{display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--cream);color:var(--ink);border:3px solid #8a7e6e;padding:0;line-height:1;box-shadow:0 2px 0 #0004}
.ava span{font-size:20px}.ava small{font-size:9px;font-weight:800}
.round{width:38px;height:38px;border-radius:50%;background:var(--cream);color:var(--ink);padding:0;font-size:20px;font-weight:800;box-shadow:0 2px 0 #0004;margin-left:auto}
.cur .ic{width:32px;height:32px;border-radius:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:900;padding:0;background:#555;flex:0 0 auto}
.cur .ic.g{background:#3f8f4c}.cur .ic.b{background:#3e5a8a}.cur .ic.o{background:#e0902a}
.qchip{position:relative;overflow:hidden;background:#2b2723e6;color:var(--cream);border:0;border-radius:8px;padding:6px 6px 8px;font-size:12px;font-weight:700;box-shadow:none;text-align:center;line-height:1.15;min-height:36px;display:flex;align-items:center;justify-content:center}
.qchip i{position:absolute;left:0;bottom:0;height:3px;background:var(--green);width:0}
.qchip.done{background:var(--green);color:#fff}
.qchip.dark{font-weight:600}
.qchip.done i{display:none}
.qchip[hidden]{display:none}
#top>*{pointer-events:auto}
.bar1,.bar2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;align-items:stretch}
.cur{display:flex;align-items:center;gap:0;background:var(--cream);color:var(--ink);border-radius:8px;padding:0;height:32px;overflow:hidden;font-weight:800;font-size:16px;box-shadow:0 2px 0 #0004}.cur b{flex:1;text-align:right;padding:0 9px}
.cur i{font-style:normal;background:#fff;border-radius:7px;padding:1px 5px;font-size:14px}
.cur.ticket{font-weight:600}.cur.ticket b{font-weight:800}
.cur.hard{background:#3e5a8a;color:#fff}.cur.hard i{background:#2c4470}
button.hard{background:#3e5a8a;box-shadow:0 3px 0 #2c4470}
.icon{background:var(--cream);color:var(--ink);border:0;border-radius:10px;width:34px;height:34px;font-weight:800;font-size:16px;box-shadow:0 2px 0 #0004;margin-left:auto;padding:0}
.chip{background:var(--cream);color:var(--ink);border:0;border-radius:9px;padding:5px 9px;font-size:13px;font-weight:700;box-shadow:0 2px 0 #0004;white-space:nowrap;text-align:left}
.chip.q{background:var(--green);color:#fff}
.chip.q.done{background:var(--gold);color:var(--ink)}
.blink{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{transform:scale(1);box-shadow:0 2px 0 #0004}50%{transform:scale(1.06);box-shadow:0 2px 0 #0004,0 0 14px var(--gold)}}
.ava.ready{box-shadow:0 0 0 3px var(--gold)}
#panel .dk.hot{background:var(--green);box-shadow:0 3px 0 #2d6b38;animation:shipPulse 1.6s ease-in-out infinite}
#panel .dk.hot small{color:#eaffe8}
@keyframes shipPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){#panel .dk.hot{animation:none}}
.dot{position:absolute;top:4px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--panel)}
.dk{position:relative}
.chip.warn{background:#4a4238;color:var(--cream)}
.chip.okc{background:var(--green);color:#fff}
.chip.dimc{background:#6b6458;color:#f1e9d6}
.chip[hidden]{display:none}
#stage{flex:1;min-height:0;position:relative}
#board{width:100%;height:100%;display:block;touch-action:none}
#inv{position:absolute;left:8px;bottom:calc((var(--panelH,150px) + 8px) / var(--ui,1));display:flex;flex-direction:column;gap:5px;z-index:4}
#invList{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
#invList span{background:var(--cream);color:var(--ink);border-radius:20px;padding:4px 10px 4px 6px;font-size:13px;font-weight:700;box-shadow:0 2px 0 #0004}
#invList span.trend{outline:2px solid var(--gold)}
#invBtn{background:var(--cream);color:var(--ink);border-radius:14px;padding:6px 8px 6px;font-size:13px;font-weight:700;box-shadow:0 2px 0 #0004;display:flex;flex-direction:column;align-items:center;gap:4px;width:72px}
#invBtn em{font-style:normal;font-size:28px;line-height:1}
#invBtn i{display:block;width:56px;height:7px;border-radius:4px;background:#0002;overflow:hidden}#invBtn i b{display:block;height:100%;background:var(--green);border-radius:4px}#invBtn small{font-size:13px;font-weight:800;color:var(--ink);line-height:1}
#panel{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(20,17,14,0) 0,rgba(20,17,14,.6) 45%,rgba(20,17,14,.92) 100%);padding:70px 10px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;z-index:5;pointer-events:none}
#panel>*{pointer-events:auto;width:100%;max-width:520px}
#dock{display:flex;gap:8px;align-items:flex-end;justify-content:center}
.diebox{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:-14px}
.pill{background:var(--cream);color:var(--ink);border-radius:12px;padding:3px 12px;font-weight:800;font-size:15px;box-shadow:0 2px 0 #0004}
.pill.dark{background:#2a2521;color:#fff;font-size:12px;font-weight:700;padding:2px 10px}
.ms3{display:flex;gap:6px;margin:8px 0 4px}.msc{flex:1;position:relative;background:#fff8e6;border-radius:12px;padding:10px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;opacity:.75}
.msc.next{opacity:1;outline:2px solid var(--gold)}.msc.done{opacity:1;background:#e3efd9}.msc .msi{font-size:26px;line-height:1}.msc b{font:500 20px/1 var(--disp)}.msc .msn{font-size:12px;font-weight:700;line-height:1.15}.msc small{font-size:10px;color:#6b5f52;line-height:1.15}.msc i{position:absolute;top:4px;right:6px;font-style:normal;font-size:11px}
.bphead{display:grid;grid-template-columns:1fr 40px 1fr;text-align:center;font-weight:700;color:#6b5f52;font-size:13px;margin:10px 0 4px}
.bptrack{max-height:40vh;overflow:auto;padding:2px 0}.bprow{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:4px;margin-bottom:6px;position:relative}
.bprow::before{content:'';position:absolute;left:50%;top:-6px;bottom:-6px;width:6px;margin-left:-3px;background:#0002;z-index:0}.bprow.reached::before{background:var(--green)}
.bpn{position:relative;z-index:1;width:30px;height:30px;margin:0 auto;border-radius:50%;background:var(--cream);border:3px solid #0002;display:flex;align-items:center;justify-content:center;font:500 14px/1 var(--disp)}.bprow.reached .bpn{border-color:var(--green)}
.bpc{position:relative;border-radius:10px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;justify-content:center;text-align:center}
.bpc.free{background:#e3efd9}.bpc.paid{background:#f3d9a0}.bpc.lock{opacity:.5;filter:saturate(.5)}.bpc.done{opacity:.85}.bpc.ready{outline:2px solid var(--gold);cursor:pointer;animation:fadeIn .3s}
.bpc .bpi{font-size:24px;line-height:1}.bpc small{font-size:11px;font-weight:700;color:#2a221c}.bpc i{position:absolute;top:3px;right:5px;font-style:normal;font-size:11px}
.lbhead{background:#3a352f;color:var(--cream);margin:-14px -14px 8px;padding:12px 14px 12px;border-radius:18px 18px 0 0}

function zoneOf(i){return CFG.ZONES.findIndex(z=>i>=z.from&&i<=z.to);}
function buildTiles(){
  const t=[], biz=new Set([3,8,17,23,32,37]), chance=new Set([5,15,25,35]), wh=new Set([6,10,19,24,30,34]);
  const rnd=(a,b)=>Math.round((a+Math.random()*(b-a))/10)*10;
  for(let i=0;i<40;i++){
    const z=zoneOf(i); let o={i,type:'kiosk',zone:z,owner:null,level:0,capLvl:1,salesLvl:1,goods:0,tier:1};
    if(i===0)o.type='home'; else if(wh.has(i))o.type='wh'; else if(i===20)o.type='bank'; // home — «Старт» в интерфейсе
    else if(i===15){o.type='police';o.zone=-1;} else if(i===25){o.type='pot';o.zone=-1;} else if(i===35){o.type='scatter';o.zone=-1;}
    else if(i===5){o.type='hazard';o.zone=-1;}
    else if(biz.has(i)){o.type='biz';o.price=rnd(...CFG.BIZ_PRICE[z]);o.price0=o.price;}
    else{o.price=rnd(...CFG.KIOSK_PRICE[z]);o.price0=o.price;const gs=CFG.GOODS.filter(g=>g.zone===z);o.good=gs[i%gs.length].id;o.base=o.good;}
    t.push(o);
  }
  return t;
}

const QTEXT={sell:g=>`Продай ${g} шт`,buy:g=>`Купи ${g} ${g===1?'точку':'точки'}`,upg:g=>`Прокачай ${g} раз`,parcel:g=>`Поставка на ${g}+ очков`,earn:g=>`Заработай $${g}`};
function newQuest(){
  const L=CFG.QUEST_LADDER[Math.min(S.day,CFG.QUEST_LADDER.length)-1];
  const mk=(q,rw)=>({id:q.id,goal:q.goal,text:QTEXT[q.id](q.goal),prog:0,done:false,claimed:false,reward:rw});
  S.q=[mk(L.easy,CFG.QUEST_EASY_REWARD),mk(L.hard,L.reward)];
}
function qProg(id,n,max){if(!S.q)return;for(const q of S.q){if(q.id!==id||q.done)continue;q.prog=max?Math.max(q.prog,n):q.prog+n;if(q.prog>=q.goal){q.done=true;toast('🎯 Задание выполнено — забери награду сверху.');}}}
const rwText=r=>r.rolls?'+'+r.rolls+' ходов':r.hard?'+💎 '+r.hard:'+$'+r.cash;
async function questClick(){
  if(!S.q)return;
  const ready=S.q.filter(q=>q.done&&!q.claimed);
  if(ready.length){for(const q of ready){const r=q.reward;if(r.rolls)S.rolls+=r.rolls;if(r.cash)S.cash+=r.cash;q.claimed=true;log(`🎯 Награда за «${q.text}»: ${rwText(r)}.`);}toast('Награда получена');save();render();return;}
  await modal(`<h2>🎯 Задания дня</h2>`+S.q.map((q,i)=>`<div class="row"><span class="n">${i?'🔥 ':''}${q.text}<small>${i?'сложное':'разогрев'} · награда ${rwText(q.reward)}</small></span><span class="v">${q.claimed?'✓':Math.min(q.prog,q.goal)+'/'+q.goal}</span></div>`).join('')+`<p>Линейка одна для всех игроков и растёт по дням. Незабранная награда сгорает в полночь.</p>`,[{t:'Ок',v:1}]);
}

function softPackAmount(mult){const zi=Math.max(0,S.opened.lastIndexOf(true));const r=CFG.KIOSK_PRICE[zi];return Math.round((r[0]+r[1])/2*mult/10)*10;}
function hardForCash(amt){const per=softPackAmount(1)/CFG.SHOP_SOFT[0].hard;return Math.max(1,Math.ceil(amt/per));} // сколько 💎 стоит недостающий нал по курсу малого софт-пакета
async function needCash(amt,t){const h=hardForCash(amt),st=CFG.OFFERS.starter;
  offerShow('need_cash',{amt,hardNeed:h,hard:S.hard,tile:t?t.i:null,ttype:t?t.type:null,day:S.day});
  const v=await modal(`<h2>💵 Не хватает $${amt}</h2><p class="t">${t?'На '+(t.type==='biz'?bizName(t):pointName(t))+' не хватает $'+amt+'.':''} Доллары можно получить за кристаллы по курсу магазина.</p>
    <div class="row"><span class="n">💵 $${amt}</span><span class="v">💎 ${h}</span></div>`,
    [{t:`Докупить · 💎 ${h}`,v:1,cls:'hard',dis:S.hard<h},...(S.hard<h?[{t:`💎 ${st.hard} за ${st.rub} ₽`,v:4,cls:'ok'}]:[]),{t:'Позже',v:0,cls:'sec'}]);
  if(v===4){buyPack({hard:st.hard,rub:st.rub},'need_cash');if(S.hard>=h&&spendHard(h)){S.cash+=amt;track('buy_soft',{amt,cost:h,tr:'need_cash'});fly('💵',AT.card(),AT.cash(),flyN(amt),{pulse:'sCash'});}}
  else if(v===1&&spendHard(h)){S.cash+=amt;track('buy_soft',{amt,cost:h,tr:'need_cash'});fly('💵',AT.card(),AT.cash(),flyN(amt),{pulse:'sCash'});log(`Докупил $${amt} за 💎 ${h}.`);}
  offerDone('need_cash',v===1||v===4,{choice:v===4?'pack':v===1?'hard':'skip',amt});
  save();render();}
function buyPack(pk,tr){
  if(S.packDay!==S.day){S.packDay=S.day;S.packsToday=0;}
  if((S.packsToday||0)>=CFG.PACKS_PER_DAY){toast(`В прототипе пакеты выдаются бесплатно, но не больше ${CFG.PACKS_PER_DAY} в день — иначе баланс не проверить.`,3800);track('pack_limit',{day:S.day});return false;}
  S.packsToday=(S.packsToday||0)+1;S.packsTotal=(S.packsTotal||0)+1;S.rubTotal=(S.rubTotal||0)+(pk.rub||0);
  track('iap',{rub:pk.rub,hard:pk.hard,tr,packs:S.packsTotal});S.hard+=pk.hard;fly('💎',AT.card(),AT.hard(),4,{pulse:'sHard'});log(`Купил 💎 ${pk.hard} (${pk.price||pk.rub+' ₽'}), повод: ${tr}.`);save();render();}
async function shopHard(){ track('window',{w:'hard_shop',hard:S.hard,day:S.day});

    $('card').innerHTML=`<h2>🛒 Магазин <small>💎 ${S.hard}</small>${helpBtn('Кристаллы покупают ходы и доллары. Каждая покупка ходов удваивает цену следующей; в полночь цена сбрасывается.')}</h2>

      <p class="dim" style="margin-top:10px">Наличные</p>
      ${CFG.SHOP_SOFT.map((pk,i)=>`<div class="row"><span class="n">💵 $${softPackAmount(pk.mult)}</span><button class="sm hard" data-soft="${i}" ${S.hard<pk.hard?'disabled':''}>💎 ${pk.hard}</button></div>`).join('')}
      <p class="dim" style="margin-top:10px">Кристаллы</p>

    $('card').querySelectorAll('button[data-pk]').forEach(b=>b.onclick=()=>{buyPack(CFG.SHOP_HARD[+b.dataset.pk],'shop');draw();});

  };
  draw(); await openCustom(); save(); render();
}

  if(S.stat.parcels>0)return 3;
  const owned=myKiosks();
  if(!owned.length)return 0;
  return owned.some(t=>t.goods>0)||S.stat.sold>0?2:1;
}
function ownedCargoReady(){return myKiosks().some(t=>stock(t.good)>=slotUnits());}
function fullCargoReady(){return Object.values(parcelAutoBox(1)).reduce((a,b)=>a+b,0)>=slots();}

let tipT;
function positionTip(){
  const tip=$('tip');if(tip.hidden)return;
  const head=$('top').getBoundingClientRect().bottom+8, modalOpen=!$('modal').hidden;
  tip.style.top='0px';tip.style.bottom='auto';
  tip.style.maxHeight=Math.max(90,Math.min(210,innerHeight-head-180))+'px';
  const h=tip.getBoundingClientRect().height;
  const panel=$('guide')&&!$('guide').hidden?$('guide'):$('tilebar')&&!$('tilebar').hidden?$('tilebar'):$('dock');
  const top=modalOpen?head:Math.max(head,panel.getBoundingClientRect().top-h-12);
  tip.style.top=Math.max(8,Math.min(innerHeight-h-8,top))+'px';
  $('modal').classList.toggle('has-tip',modalOpen);
  document.documentElement.style.setProperty('--tip-space',modalOpen?h+16+'px':'0px');
}
function showTip(text){if($('helpDialog').open)return;const toastEl=$('toast');clearTimeout(toastT);toastEl.style.opacity=0;toastEl.style.pointerEvents='none';const el=$('tip');el.textContent='💡 '+text;el.hidden=false;document.body.classList.add('coach-tip-open');positionTip();fitCard();clearTimeout(tipT);tipT=setTimeout(hideTip,15000);}
function hideTip(){$('tip').hidden=true;document.body.classList.remove('coach-tip-open');clearTimeout(tipT);$('modal').classList.remove('has-tip');document.documentElement.style.setProperty('--tip-space','0px');}
function helpBtn(text){return `<button class="qm" data-h="${text.replace(/"/g,'&quot;')}" aria-label="Объяснить" aria-haspopup="dialog" onclick="openHelp('start',false,this.dataset.h)">?</button>`;}

function dateKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function migrate(){
  const d={overtime:0,pts:0,xp:0,laps:0,parcelSent:false,trend:null,loans:[],taxi:CFG.TAXI_PER_DAY,opened:[true,false,false],pot:0,jail:0,jailFine:0,tips:{},log:[],finished:false,
    stat:{earned:0,sold:0,parcels:0,bought:0},dstat:{earned:0,sold:0,pts:0,bought:0},bag:{},extraSlots:0,extraSlotsSoft:0,player:null,bp:{claimedFree:0,claimedPaid:0,paid:false},lbSeed:Math.floor(Math.random()*1e9),hard:CFG.START_HARD,taxiRides:0,lastTick:Date.now(),dayDate:dateKey(),runId:Math.random().toString(36).slice(2,10),startedAt:Date.now(),playMs:0,dayMs:{},sessions:0,chunkN:0};
  for(const k in d)if(S[k]===undefined)S[k]=typeof d[k]==='object'?JSON.parse(JSON.stringify(d[k])):d[k];
  if(S.tips.guideActive===undefined)S.tips.guideActive=!!S.tips.intro&&!(S.stat.parcels>0);
  if(!S.firstRoute||typeof S.firstRoute!=='object'){
    if(S.day===1&&S.laps===0&&!S.finished){
      const variant=S.pos===4?1:0,plan=FIRST_LAP_ROUTES[variant];let index=plan.indexOf(S.pos);
      if(index<0)index=plan.findIndex(x=>x>S.pos);if(index<0)index=plan.length-1;
      S.firstRoute={variant,index,done:false};
    }else S.firstRoute={variant:0,index:0,done:true};
  }
  if(!Array.isArray(S.q))newQuest();
  if(!S.lastTick)S.lastTick=Date.now(); if(!S.dayDate)S.dayDate=dateKey();
  if(S.loan&&!(S.loans||[]).length){S.loans=[{tier:1,name:'Обычный',principal:S.loan.principal,rate:0.08,strikes:S.loan.strikes||0,maxStrikes:2}];} S.loan=undefined;
  if(!Array.isArray(S.tiles)||S.tiles.length!==40)S.tiles=buildTiles();
  S.tiles.forEach((t,i)=>{if(t.tier===undefined)t.tier=1;if(t.price0===undefined&&(t.type==='kiosk'||t.type==='biz')&&t.zone>=0){const mult=CFG.TIER_PRICE_MULT[t.type],rng=CFG[t.type==='biz'?'BIZ_PRICE':'KIOSK_PRICE'][t.zone];let p=t.price;for(let k=(t.tier||1)-1;k>=1;k--)p=Math.round(p/mult[k]/10)*10;t.price0=Math.min(rng[1],Math.max(rng[0],p));}if(t.type==='kiosk'&&t.good&&good(t.good)&&goodTier(good(t.good))!==t.tier)t.tier=goodTier(good(t.good));if(t.type==='kiosk'&&!t.base){const gs=CFG.GOODS.filter(g=>g.zone===t.zone);if(gs.length)t.base=gs[t.i%gs.length].id;}if(t.type==='kiosk'&&t.tier>1){const base=CFG.GOODS.filter(g=>g.zone===t.zone);let g=base[t.i%base.length];for(let k=1;k<t.tier&&g.next;k++)g=good(g.next);if(t.good!==g.id){t.good=g.id;t.goods=0;}t.price=tierPrice(t.type,t.price0!==undefined?t.price0:t.price,t.tier);/* v13.3: раньше ставилась минимальная база тира и дорогие точки дешевели в разы */}if(t.capLvl===undefined)t.capLvl=1;if(t.salesLvl===undefined)t.salesLvl=1;if(t.goods===undefined)t.goods=0;if(t.type==='kiosk'){t.capLvl=Math.min(t.capLvl,capTab(t).length);t.salesLvl=Math.min(t.salesLvl,salTab(t).length);}});
  // раскладка сервисных клеток текущей версии — если сохранение из версии с другой раскладкой, подтягиваем типы
  const ref=buildTiles(); S.tiles.forEach((t,i)=>{const r=ref[i];if(r.type!=='kiosk'&&r.type!=='biz'&&t.type!==r.type&&!t.owner){Object.assign(t,r);} if(r.zone===-1)t.zone=-1;});
  if(!S.tiles.some(t=>t.type==='wh')){S.tiles.forEach((t,i)=>{const r=ref[i];if((r.type==='wh'||r.type==='bank')&&t.type!==r.type){Object.assign(t,{type:r.type,owner:null,goods:0,capLvl:1,salesLvl:1,tier:1});}});}
  if(!S.starter||S.starter.version!==2){
    const granted=S.starter?S.starter.granted||0:0;
    S.starter={version:2,earned:[],claimed:[],granted,closed:S.day!==1};
    if(myKiosks().length)S.starter.earned.push('point');
    if(myKiosks().some(t=>t.goods>0)||S.stat.sold>0)S.starter.earned.push('stock');
    if(S.stat.parcels>0)S.starter.earned.push('shipment');
  }
  if(!S.training)S.training={shipped:false,explained:false,skipped:S.day!==1||S.stat.parcels>0};

}

// ---------- формулы ----------
const good=id=>CFG.GOODS.find(g=>g.id===id);
function level(){let l=1;CFG.PATSAN_XP.forEach((x,i)=>{if(S.xp>=x)l=i+1;});return l;}
function perk(){const L=level();return{disc:L>=7?0.2:L>=2?0.1:0,salesPct:(L>=3?0.15:0)+(L>=8?0.15:0)+(L>=10?0.15:0),fee:L>=9?1.5:L>=4?1.25:1,dbl:L>=5,slots:(L>=6?1:0)};} // места в фуре — платная механика, перк даёт максимум одно
function buyPrice(g){return Math.max(1,Math.round(good(g).buy*(1-perk().disc)));}
function sellPrice(g){let p=good(g).sell;if(S.trend===g)p*=CFG.TREND_MULT;if(S.day===CFG.BLACK_FRIDAY_DAY)p*=CFG.BF_MULT;return Math.round(p);}
function klevel(t){return t.type==='biz'?t.level:t.capLvl+t.salesLvl-1;}
function fee(t){const c=t.type==='biz'?CFG.BIZ:CFG.KIOSK;return Math.max(1,Math.round(t.price*c.feePct*Math.pow(c.feeLevelMult,klevel(t)-1)*perk().fee));}
function capTab(t){return CFG.KIOSK.capacity[Math.min((t.tier||1),CFG.KIOSK.capacity.length)-1];}
function salTab(t){return CFG.KIOSK.sales[Math.min((t.tier||1),CFG.KIOSK.sales.length)-1];}
function cap(t){return capTab(t)[Math.min(t.capLvl,capTab(t).length)-1];}
function salesBoost(base){const p=perk().salesPct;return p>0?base+Math.max(1,Math.round(base*p)):base;} // перк Джонни: % от оборота, но не меньше +1 шт
function sales(t){return salesBoost(salTab(t)[Math.min(t.salesLvl,salTab(t).length)-1]);}
function capCost(t){return Math.round(t.price*CFG.KIOSK.capUpMult*t.capLvl);}
function salesCost(t){return Math.round(t.price*CFG.KIOSK.salesUpMult*t.salesLvl);}
// окупаемость в кругах: 12, но не больше 60% кругов, которые осталось пробежать до конца недели
function paybackLaps(){const daysLeft=Math.max(1,CFG.DAYS-S.day+1);return Math.max(CFG.BIZ.minPayback,Math.min(CFG.BIZ.paybackLaps,Math.round(daysLeft*CFG.LAPS_PER_DAY_EST*0.6)));}
function bizUpCost(t){const cur=fee(t),next=Math.round(t.price*CFG.BIZ.feePct*Math.pow(CFG.BIZ.feeLevelMult,t.level)*perk().fee);return Math.max(50,Math.round((next-cur)*paybackLaps()/10)*10);}
function unlocked(t){return t.zone<0||S.opened[t.zone];}
function zonePrice(zi){const z=CFG.ZONES[zi];if(S.day>=z.day)return 0;return Math.ceil(z.hard*(z.day-S.day)/(z.day-1)/10)*10;} // в 💎

function pay(m){m=Math.max(0,Math.min(S.cash,Math.round(m)));if(m>0)fly('💵',AT.cash(),AT.pot(),flyN(m));S.cash-=m;S.pot+=m;return m;} // все штрафы падают в копилку

function payFine(m){m=Math.round(m);const floorCash=-Math.round(Math.min(m*0.5,Math.max(20,lapNet()*0.5)));const take=Math.min(m,Math.max(0,S.cash-floorCash));
  S.cash-=take;S.pot+=take;if(take>0)fly('💵',AT.cash(),AT.pot(),flyN(take));

    const target=p[S.firstRoute.index],total=(target-S.pos+40)%40;

const ease={lin:p=>p,in:p=>p*p,out:p=>1-(1-p)*(1-p),one:p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2};
function step(from,to,ms,kind){if(CFG.SPEED>=100)return Promise.resolve();return new Promise(res=>{
  const a={from,to,t0:performance.now(),ms:ms/CFG.SPEED,kind,res,done:false};anim=a;kick();
  // страховка: если кадры не тикают (вкладка в фоне), шаг всё равно завершится
  setTimeout(()=>{if(anim===a&&!a.done){a.done=true;a.p=1;res();}},a.ms+60);
});}
function kick(){if(!looping){looping=true;requestAnimationFrame(loop);}}
function loop(now){
  if(anim&&!anim.done){let p=Math.min(1,(now-anim.t0)/anim.ms);anim.p=ease[anim.kind](p);if(p>=1){anim.done=true;anim.p=1;anim.res();}}
  draw();
  for(const f of flyers){f.p=Math.min(1,(now-f.t0)/f.ms);if(f.p>=1&&!f.done){f.done=true;f.onDone&&f.onDone();}}
  flyers=flyers.filter(f=>!f.done);
  if((anim&&!anim.done)||floats.length||camMoving||flyers.length)requestAnimationFrame(loop); else looping=false;
}

  render(); await wait(200);

// проценты списываются при каждом проходе клетки банка (не на старте): прошёл банк — заплатил
// процент списывается всегда: нечем платить — нал уходит в минус, и это просрочка; в минусе ничего не купить, пока не отобьёшься
function loanCharge(){ const i=loanInterest(); if(i<=0)return false;
  S.cash-=i;S.stat.interest=(S.stat.interest||0)+i;fly('💵',AT.cash(),AT.tile(20),flyN(i));float(20,'−$'+i+' банк','#ef5350');track('loan_interest',{amt:i,cash:S.cash});

}
// полночь: не выбрался из минуса — просрочка по каждому кредиту; вторая просрочка — конфискация
function loanMidnight(){ if(!(S.loans||[]).length||S.cash>=0)return;
  if((S.loanGrace===undefined?CFG.LOAN_GRACE:S.loanGrace)>0){S.loanGrace=(S.loanGrace===undefined?CFG.LOAN_GRACE:S.loanGrace)-1;S.graced=true;track('loan_grace',{cash:S.cash});log(`День закончился в минусе $${-S.cash}. Банк простил — один раз за ивент.`);return;}
  S.graced=false;S.seized=null;
  for(const l of (S.loans||[]).slice()){l.strikes++;log(`День закончился в минусе: просрочка по «${l.name}» (${l.strikes}/${l.maxStrikes}).`);track('loan_strike',{tier:l.tier,strikes:l.strikes,cash:S.cash});
    if(l.strikes>=l.maxStrikes){const mine=seizePlan(l.principal);
      const names=mine.map(m=>m.type==='biz'?bizName(m):pointName(m)+' '+good(m.good).icon);
      const seizedVal=mine.reduce((a,m)=>a+assetValue(m),0);
      mine.forEach(m=>{const nm=m.type==='biz'?bizName(m):name(m);m.owner=null;m.level=0;m.capLvl=1;m.salesLvl=1;m.goods=0;m.tier=1;m.price=m.price0||m.price;if(m.type==='kiosk'&&m.base)m.good=m.base;log(`Коллекторы забрали ${nm}.`);});

}

// ---------- склад: закупка по товару, раскладка по ларькам сама (сначала ларьки с большими продажами) ----------
function goodKiosks(g){return myKiosks().filter(t=>t.good===g).sort((a,b)=>sales(b)-sales(a));}
function goodCap(g){return goodKiosks(g).reduce((s,t)=>s+cap(t),0);}
function goodSales(g){return goodKiosks(g).reduce((s,t)=>s+sales(t),0);}
let lastFly={};
function addGoods(g,n){ // по кругу, начиная с самых продающих; возвращает сколько реально разложено
  const ks=goodKiosks(g);let put=0;const got=new Set();
  while(n>0){let any=false;for(const t of ks){if(n<=0)break;if(t.goods<cap(t)){t.goods++;n--;put++;any=true;got.add(t.i);}}if(!any)break;}
  const now=performance.now(); if(put&&now-(lastFly[g]||0)>160){lastFly[g]=now;fly('💵',AT.cash(),AT.card(),1);got.forEach(i=>fly(good(g).icon,AT.card(),AT.tile(i),1,{delay:120}));}
  return put;
}
async function shop(){ track('window',{w:'costco',cash:S.cash,day:S.day});

    const ks=myKiosks(), need=ks.reduce((s,t)=>s+(cap(t)-t.goods)*buyPrice(t.good),0), minP=Math.min(...ks.filter(t=>t.goods<cap(t)).map(t=>buyPrice(t.good)),Infinity);
    const rows=gs.map(g=>{const kk=goodKiosks(g.id),c=goodCap(g.id),st=stock(g.id),p=buyPrice(g.id),free=c-st,pc=c?Math.round(st/c*100):0;
      return `<div class="wr ${S.trend===g.id?'trend':''}"><span class="ring" style="--p:${pc}%"><i>${g.icon}</i></span><div class="wn">${g.name}${S.trend===g.id?' 🔥×'+CFG.TREND_MULT:''}<small>${[...new Set(kk.map(k=>pointName(k)))].join(', ')} · ⟳ ${goodSales(g.id)}/круг · $${sellPrice(g.id)}</small></div><span class="wq">${st}/${c}</span><button data-g="${g.id}" title="${free<=0?'склад полон':S.cash<p?'не хватает $':''}" ${free<=0||S.cash<p?'disabled':''}>${free<=0?'Полно':'+1 · $'+p}</button></div>`;}).join('');
    hintHtml('shop','Это склад. Закупай здесь товары для своих точек. Проходя клетку СТАРТ, товары продаются автоматически, а ты получаешь прибыль.');
    $('modal').classList.add('mid'); $('card').className='card bare';

      <div class="whead">Покупай товары для точек ${helpBtn('Тут ты можешь закупить товар, который продается автоматически с наценкой, когда ты проходишь клетку старт. Чем больше у тебя точек, тем больше товара ты можешь купить. Также, товар нужен, чтобы делать отправку партий, а это твоя главная задача!')}</div>

    </div><button class="xclose" id="wNo">✕</button>`; fitCard();
    $('card').querySelectorAll('button[data-g]').forEach(b=>{b.id='wb_'+b.dataset.g;hold(b,(k=1)=>{const g=b.dataset.g,p=buyPrice(g);let n=0;while(n<k&&goodCap(g)-stock(g)>0&&S.cash>=p&&addGoods(g,1)){S.cash-=p;n++;}if(n){earnStarter('stock');if(trainingPending()){holdStop();closeModal();save();render();return;}draw();}render();});});
    const all=$('wAll'); if(all)all.onclick=()=>{let spent=0;
      // денег на всё хватает — просто заполнить; не хватает — сначала самое выгодное, по одному кругу продаж на точку, кругами
      if(S.cash>=need){for(const g of CFG.GOODS){const p=buyPrice(g.id);while(goodCap(g.id)-stock(g.id)>0&&S.cash>=p){if(!addGoods(g.id,1))break;S.cash-=p;spent+=p;}}}

    $('wNo').onclick=()=>closeModal();
  };
  draw(); await openCustom(); const spent=cash0-S.cash, units=myKiosks().reduce((a,t)=>a+t.goods,0)-stock0; if(spent>0)track('shop',{spent,units}); save(); render();
}

async function scatter(){

// ---------- рендер ----------
const cv=$('board'),cx=cv.getContext('2d');
let TW=60,TH=30,OX=0,OY=0;
function gridOf(i){if(i<10)return[10-i,10];if(i<20)return[0,20-i];if(i<30)return[i-20,0];return[10,i-30];}
function iso(gx,gy){return[OX+(gx-gy)*TW/2,OY+(gx+gy)*TH/2];}
function panelH(){const p=$('panel');const h=(p&&p.offsetHeight)||0;return h>20?h-40:0;} // док лежит поверх поля; часть его высоты — прозрачный градиент
function fit(){
  try{const ui=Math.max(0.78,Math.min(1,window.innerWidth/430,window.innerHeight/840));document.documentElement.style.setProperty('--ui',ui.toFixed(3));
    if(!('zoom' in document.documentElement.style)){document.documentElement.classList.add('nozoom');[['top','top center'],['panel','bottom center'],['inv','bottom left'],['tip','bottom center'],['toast','top center']].forEach(([id,o])=>{const el=$(id);if(el){el.style.transform=`scale(${ui})`;el.style.transformOrigin=o;}});}
    const ph=$('panel').getBoundingClientRect().height,th=$('top').getBoundingClientRect().height;
    document.documentElement.style.setProperty('--panelH',Math.max(80,(ph||220)-70*ui)+'px');document.documentElement.style.setProperty('--topH',(th||170)+'px');}catch(e){}
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  TW=Math.max(56,Math.min(130,r.width/CFG.ZOOM));TH=TW*0.58;OX=0;OY=0;
}
function float(i,text,color,size){const[gx,gy]=gridOf(i),[x,y]=iso(gx,gy);floats.push({x,y:y-10,text,color,t:0,size:size||1});kick();}
const LOCK_COL='#4a453d', FREE_COL='#d6ccb0';
// сумма дропа → стопка монет 1..4 (относительно разброса инкассатора за день)
// повторная находка на той же клетке складывается, а не заменяется
function mergeDrop(a,b){ if(!a)return b; const o=Object.assign({},a);
  for(const k of ['cash','rolls','hard','goods','hour'])if(b[k])o[k]=(o[k]||0)+b[k];
  return o;}
function coinTier(cash){const c=CFG.SCATTER,lo=c.min*S.day,hi=c.max*S.day*2.5;const q=hi>lo?(cash-lo)/(hi-lo):1;return Math.max(1,Math.min(5,1+Math.floor(q*5)));} // 5 градаций: чем больше денег, тем выше стопка
function tierOf(n,steps){let t=1;steps.forEach((v,i)=>{if(n>=v)t=i+1;});return Math.min(5,t);}
function rollsTier(n){return tierOf(n,[1,3,5,8,12]);}
function hardTier(n){return tierOf(n,[1,2,3,5,8]);}
// стопка одинаковых иконок: чем больше нашлось, тем выше кучка
function drawStack(px,py,tier,icon,sz){const step=sz*0.34;
  for(let k=0;k<tier;k++){cx.font=`${Math.round(sz)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(icon,px+(k%2?sz*0.08:-sz*0.06),py-k*step);}}
function drawCoins(px,py,tier){const rx=TW*(0.085+0.012*tier),ry=rx*0.5,step=rx*0.42,n=tier;
  for(let k=0;k<n;k++){const yy=py-k*step;cx.beginPath();cx.ellipse(px,yy,rx,ry,0,0,Math.PI*2);cx.fillStyle=k===n-1?'#ffd54f':'#e2a72e';cx.fill();cx.lineWidth=Math.max(1,TW*0.012);cx.strokeStyle='#7a5a12';cx.stroke();}
  // ребро верхней монеты и блик
  const top=py-(n-1)*step;cx.beginPath();cx.ellipse(px,top,rx*0.62,ry*0.62,0,0,Math.PI*2);cx.strokeStyle='#b8860b';cx.lineWidth=Math.max(1,TW*0.01);cx.stroke();
  cx.beginPath();cx.ellipse(px-rx*0.3,top-ry*0.25,rx*0.18,ry*0.16,0,0,Math.PI*2);cx.fillStyle='#fff3c4';cx.fill();}
function tileColor(t){
  if(t.type==='home')return'#c0392b';if(t.type==='wh')return'#bfb59a';if(t.type==='bank')return'#2e7d32';if(t.type==='chance')return'#ff7043';
  if(t.type==='police')return'#546e7a';if(t.type==='pot')return'#f9a825';if(t.type==='scatter')return'#00897b';if(t.type==='hazard')return'#6d4c41';
  if(!unlocked(t))return LOCK_COL;
  if(!t.owner)return FREE_COL; // свободная точка нейтральная: цвет получает, когда входит в дело
  return t.type==='biz'?'#8e6bd1':CFG.ZONES[t.zone].color;
}
function mix(a,b,p){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const c=sh=>Math.round(((A>>sh)&255)+(((B>>sh)&255)-((A>>sh)&255))*p);return'#'+[16,8,0].map(sh=>c(sh).toString(16).padStart(2,'0')).join('');}
function revealP(t){if(!reveal||t.zone!==reveal.zone)return 1;const z=CFG.ZONES[reveal.zone];return Math.max(0,Math.min(1,(Date.now()-reveal.t0-(t.i-z.from)*150)/600));}
function tileH(t){return 0;} // поле плоское; уровень показывают звёзды
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const c=v=>Math.max(0,Math.min(255,v+amt));return`rgb(${c(n>>16)},${c((n>>8)&255)},${c(n&255)})`;}
let camMoving=false;
function drawPrototype(){
  const r=cv.getBoundingClientRect();cx.clearRect(0,0,r.width,r.height);
  // герой: позиция (интерполяция между клетками + прыжок)
  let hx,hy,hop=0,hi=S.pos;
  if(anim&&anim.done&&S.pos===anim.to)anim=null; // S.pos догнал анимацию — можно отпустить
  if(anim){const[a1,a2]=gridOf(anim.from),[b1,b2]=gridOf(anim.to),p=anim.p||0;
    const A=iso(a1,a2),B=iso(b1,b2);hx=A[0]+(B[0]-A[0])*p;hy=A[1]+(B[1]-A[1])*p;hop=Math.sin(Math.PI*p)*TH*0.7;hi=p<0.5?anim.from:anim.to;}
  else{const[g1,g2]=gridOf(S.pos);[hx,hy]=iso(g1,g2);}
  // камера плавно догоняет фишку
  if(camHold&&Date.now()<camHold.until)camT={x:camHold.x,y:camHold.y};else{camHold=null;camT={x:hx,y:hy-TH*0.9};}
  cam.x+=(camT.x-cam.x)*0.18;cam.y+=(camT.y-cam.y)*0.18;
  camMoving=Math.hypot(camT.x-cam.x,camT.y-cam.y)>0.5;
  cx.save();cx.translate(r.width/2-cam.x+pan.x,(r.height-panelH())/2-cam.y+pan.y);
  const order=S.tiles.slice().sort((a,b)=>{const[ax,ay]=gridOf(a.i),[bx,by]=gridOf(b.i);return(ax+ay)-(bx+by);});
  cx.beginPath();const c=[iso(1,1),iso(9,1),iso(9,9),iso(1,9)];cx.moveTo(c[0][0],c[0][1]);c.forEach(p=>cx.lineTo(p[0],p[1]));cx.closePath();cx.fillStyle='#3a3630';cx.fill();
  const[cxx,cyy]=iso(5,5);
  cx.fillStyle='#4d473f';cx.font=`${Math.round(TW*0.22)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('BROOKLYN · NY',cxx,cyy);
  const drawHero=()=>{const t=S.tiles[hi],h=tileH(t);
    const hyy=hy-TH*0.5-h*0.2-hop;cx.save();cx.shadowColor='#0009';cx.shadowBlur=4;cx.shadowOffsetY=2;cx.fillStyle='rgba(43,39,35,0.85)';cx.beginPath();cx.arc(hx,hyy,TW*0.23,0,Math.PI*2);cx.fill();cx.restore();
    cx.strokeStyle='#f1e9d2';cx.lineWidth=2;cx.beginPath();cx.arc(hx,hyy,TW*0.23,0,Math.PI*2);cx.stroke();
    cx.font=`${Math.round(TW*0.36)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('🧢',hx,hyy+1);};
  // подписи поля в стиле HUD: кремовая пилюля, чернильный текст
  const pill=(px,py,text,fg,sz,bg,stroke)=>{cx.font=`bold ${Math.round(sz)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';const w=cx.measureText(text).width+sz*0.9,hh=sz*1.35;
    cx.fillStyle=bg||'#f1e9d2';cx.beginPath();cx.roundRect(px-w/2,py-hh/2,w,hh,hh/2);cx.fill();if(stroke){cx.lineWidth=2;cx.strokeStyle=stroke;cx.strokeText(text,px,py+0.5);}cx.fillStyle=fg;cx.fillText(text,px,py+0.5);return w;};
  const pillW=(text,sz)=>{cx.font=`bold ${Math.round(sz)}px sans-serif`;return cx.measureText(text).width+sz*0.9;};
  const labelRow=(px,py,items)=>{const gap=TW*0.04;let tot=items.reduce((a,it)=>a+pillW(it.t,it.sz),0)+gap*(items.length-1),cxp=px-tot/2;for(const it of items){const w=pillW(it.t,it.sz);pill(cxp+w/2,py,it.t,it.fg,it.sz,it.bg,it.stroke);cxp+=w+gap;}};
  const outlined=(px,py,text,fg,sz)=>{cx.font=`bold ${Math.round(sz)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=Math.max(2,sz*0.18);cx.strokeStyle='#2b2723';cx.strokeText(text,px,py);cx.fillStyle=fg;cx.fillText(text,px,py);};
  const now=Date.now();let anyEmpty=false;
  let anyReveal=false;
  for(const t of order){
    const[gx,gy]=gridOf(t.i),[x0,y0]=iso(gx,gy),lock=!unlocked(t),h=tileH(t),rp=revealP(t),col=rp<1?mix(LOCK_COL,tileColor(t),rp):tileColor(t);
    const x=x0,y=y0-Math.sin(rp*Math.PI)*TH*0.6; if(rp<1)anyReveal=true;
    if(h>0){cx.fillStyle=shade(col,-35);cx.beginPath();cx.moveTo(x-TW/2,y);cx.lineTo(x,y+TH/2);cx.lineTo(x,y+TH/2+h);cx.lineTo(x-TW/2,y+h);cx.closePath();cx.fill();
    cx.fillStyle=shade(col,-60);cx.beginPath();cx.moveTo(x+TW/2,y);cx.lineTo(x,y+TH/2);cx.lineTo(x,y+TH/2+h);cx.lineTo(x+TW/2,y+h);cx.closePath();cx.fill();}
    cx.fillStyle=col;cx.beginPath();cx.moveTo(x,y-TH/2);cx.lineTo(x+TW/2,y);cx.lineTo(x,y+TH/2);cx.lineTo(x-TW/2,y);cx.closePath();cx.fill();
    cx.strokeStyle=t.owner?(t.type==='biz'?'#ffd54f':'#fff8e1'):(lock?'#ffffff12':'#00000033');cx.lineWidth=t.owner?(t.type==='biz'?3:2):1;cx.stroke();
    if(S.trend&&t.good===S.trend&&t.owner&&!lock){cx.strokeStyle='#fff';cx.lineWidth=1;cx.setLineDash([3,3]);cx.stroke();cx.setLineDash([]);}
    let ic='';if(t.type==='home')ic='🏁';else if(t.type==='wh')ic='🏬';else if(t.type==='bank')ic='🏦';else if(t.type==='hazard')ic='🌪';else if(t.type==='police')ic='🚔';else if(t.type==='pot')ic='🎰';else if(t.type==='scatter')ic='🚚';
    else if(t.type==='biz')ic=bizIcon(t);else ic=good(t.good).icon;
    const mine=t.owner&&!lock, isK=t.type==='kiosk', isB=t.type==='biz';
    const iy=lock?y-TH*0.02:mine?y-TH*0.08:y-TH*0.02;
    cx.globalAlpha=lock?0.28:1;
    cx.font=`${Math.round(TW*(lock?0.28:0.34))}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(ic,x,iy);
    cx.globalAlpha=1;
    if(t.drop){const d=t.drop;
      if(d.cash>0){drawCoins(x+TW*0.18,y-TH*0.05,coinTier(d.cash));}
      else if(d.rolls)drawStack(x+TW*0.2,y-TH*0.22,rollsTier(d.rolls),'🎲',TW*0.26);
      else if(d.hard)drawStack(x+TW*0.2,y-TH*0.22,hardTier(d.hard),'💎',TW*0.26);
      else{cx.font=`${Math.round(TW*0.3)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('⚠️',x+TW*0.2,y-TH*0.3);}}
    if(lock)continue;
    if(mine){
      // остаток товара — кольцо вокруг иконки; пусто — красное и клетка пульсирует
      if(isK){const pc=Math.max(0,Math.min(1,t.goods/cap(t))),R=TW*0.20;cx.lineWidth=TW*0.035;cx.strokeStyle='#0006';cx.beginPath();cx.arc(x,iy,R,0,Math.PI*2);cx.stroke();
        if(pc>0){cx.strokeStyle=pc>=0.3?'#3f8f4a':'#f2b632';cx.beginPath();cx.arc(x,iy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*pc);cx.stroke();}
        else{anyEmpty=true;cx.strokeStyle='#d64541';cx.beginPath();cx.arc(x,iy,R,0,Math.PI*2);cx.stroke();
          cx.globalAlpha=0.4+0.6*(0.5+0.5*Math.sin(now/160));cx.strokeStyle='#d64541';cx.lineWidth=2;cx.beginPath();cx.moveTo(x,y-TH/2);cx.lineTo(x+TW/2,y);cx.lineTo(x,y+TH/2);cx.lineTo(x-TW/2,y);cx.closePath();cx.stroke();cx.globalAlpha=1;}}
      // уровень — пипсы фиксированной ширины на нижней кромке
      if(t.boost&&t.boost.day===S.day&&TW>=48){const up=t.boost.m>1;pill(x,y-TH*0.34,up?'×1,5':'×0,5','#fff',Math.round(TW*0.17),up?'#3f8f4c':'#c9432f');}

// Celebrate actual positive outcomes, never every income tick or toast string.
// One pending reaction coalesces rewards from the same action. UI and movement
// get priority so the player sees the reaction instead of a hidden modal backdrop.
let mobilePoliceActive=false, mobilePolicePromise=null;
let mobileJoyPending=false, mobileJoyTimer=0, mobileJoyUntil=0, mobileJoyKind='joy', mobileDanceUntil=0;
let mobileNegativePending=false, mobileNegativeTimer=0, mobileNegativeUntil=0, mobilePreviousCash=null;
function mobileCheckCash(){
  // Observe a transition, not an empty wallet restored from a save or repeated renders.
  const empty=mobilePreviousCash!==null&&mobilePreviousCash>0&&S.cash<=0;
  mobilePreviousCash=S.cash;
  if(empty)queueMobileNegative();
}
function queueMobileNegative(){
  if(mobilePoliceActive)return;
  mobileJoyPending=false;
  if(Date.now()<mobileNegativeUntil)return;
  mobileNegativePending=true;
  if(!mobileNegativeTimer)mobileNegativeTimer=setTimeout(flushMobileNegative,100);
}
function mobileReactionBlocked(){
  return mobilePoliceActive||!MobileHost.ready||document.hidden||moving||!$('modal').hidden||!$('tip').hidden||$('helpDialog').open||document.body.classList.contains('dice-rolling');
}
function flushMobileNegative(){
  mobileNegativeTimer=0;
  if(!mobileNegativePending)return;
  if(mobileReactionBlocked()){mobileNegativeTimer=setTimeout(flushMobileNegative,150);return;}
  mobileNegativePending=false;mobileNegativeUntil=Date.now()+2600;
  MobileHost.send({action:'react_negative'});
}
function queueMobileJoy(kind='joy'){
  if(mobilePoliceActive)return;
  if(mobileNegativePending||Date.now()<mobileNegativeUntil)return;
  if(kind==='dance'){
    if(Date.now()<mobileDanceUntil)return;
    mobileJoyKind='dance'; // A major reward upgrades a queued/playing small reaction.
  }else{
    if(Date.now()<mobileJoyUntil)return;
    if(!mobileJoyPending)mobileJoyKind='joy';
  }
  mobileJoyPending=true;
  if(!mobileJoyTimer)mobileJoyTimer=setTimeout(flushMobileJoy,100);
}
function flushMobileJoy(){
  mobileJoyTimer=0;
  if(!mobileJoyPending)return;
  const blocked=mobileReactionBlocked();
  if(blocked){mobileJoyTimer=setTimeout(flushMobileJoy,150);return;}
  const special=mobileJoyKind==='dance';
  mobileJoyPending=false;mobileJoyKind='joy';mobileJoyUntil=Date.now()+(special?4200:2000);
  if(special)mobileDanceUntil=mobileJoyUntil;
  MobileHost.send({action:special?'celebrate_big':'celebrate'});
}
const mobileOriginalTrack=track;
track=function(type,data={}){
  const result=mobileOriginalTrack(type,data);
  if(type==='new_game'){
    mobileJoyPending=false;mobileJoyUntil=0;mobileDanceUntil=0;mobileJoyKind='joy';clearTimeout(mobileJoyTimer);mobileJoyTimer=0;
    mobileNegativePending=false;mobileNegativeUntil=0;clearTimeout(mobileNegativeTimer);mobileNegativeTimer=0;mobilePreviousCash=null;
  }
  const negative=(type==='boost'&&data.good===false)||type==='loan_default'
    ||(type==='short'&&data.needCash>0);
  if(negative)queueMobileNegative();
  const positive=(['quest_claim','milestone','starter_refill'].includes(type))
    ||(['parcel','training_shipment'].includes(type)&&data.pts>0&&!data.auto)
    ||(type==='bp_claim'&&(data.rolls>0||data.hard>0))
    ||(type==='pot'&&data.m>0)||(type==='boost'&&data.good);
  const exceptional=(type==='milestone'&&CFG.MILESTONES.some(m=>m.pts===data.pts))
    ||(type==='parcel'&&!data.auto&&data.extra>0&&data.max>0&&data.pts>data.max&&data.slots>0&&data.slotsUsed>=data.slots);
  if(exceptional)queueMobileJoy('dance');
  else if(positive)queueMobileJoy();
  return result;
};
const mobileOriginalStreet=street;
function mobileGoodSnapshot(){
  const kiosks=myKiosks();

street=async function(...args){

  if(after[0]<before[0]||after[1]<before[1]||after[2]<before[2]||(after[3]<before[3]&&after[0]<=before[0]))queueMobileNegative();
  else if(after.slice(0,5).some((n,i)=>n>before[i])||after[5]!==before[5])queueMobileJoy();

};

// Карточка результата всплывает над тем местом, где легли кубики. Координаты
// приходят из Godot в долях вьюпорта сцены; сцена занимает полосу между
// --world-top и --world-bottom, поэтому пересчитываем в пиксели окна.
// Если координат нет (старый вызов или кубик улетел за кадр) — прежнее место.
function placeDiceResult(el,x,y){
  el.style.removeProperty('left'); el.style.removeProperty('top'); el.style.removeProperty('transform');
  if (typeof x !== 'number' || typeof y !== 'number' || !isFinite(x) || !isFinite(y)) return;
  const frame = document.getElementById('godot-frame');
  if (!frame) return;
  const r = frame.getBoundingClientRect();
  if (!r.width || !r.height) return;
  el.style.visibility='hidden';
  requestAnimationFrame(() => {
    const w = el.offsetWidth || 150, h = el.offsetHeight || 54, M = 8;
    let left = r.left + x * r.width - w / 2;
    let top  = r.top  + y * r.height - h - 18;          // на 18 px выше кубиков
    left = Math.max(M, Math.min(left, window.innerWidth - w - M));
    top  = Math.max(r.top + M, Math.min(top, r.bottom - h - M));
    el.style.left = Math.round(left) + 'px';
    el.style.top = Math.round(top) + 'px';
    el.style.transform = 'none';
    el.style.visibility='';
  });
}

// Полноэкранный режим. На iOS Safari Element.requestFullscreen отсутствует —

const FullScreen = {
  supported(){
    const el = document.documentElement;
    return !!(el.requestFullscreen || el.webkitRequestFullscreen);
  },
  active(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  async toggle(){
    const el = document.documentElement;

      if(this.active()){
        await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
      }else{
        await (el.requestFullscreen ? el.requestFullscreen({navigationUI:'hide'}) : el.webkitRequestFullscreen());
        if(screen.orientation && screen.orientation.lock){

function tilebarAffordable(){
  try{

    }
    if(t.type === 'kiosk' || t.type === 'biz'){
      if(!t.owner) return S.cash >= t.price;
      if(t.type === 'biz') return true;            // у бизнеса свои правила прокачки
      const canGoods  = t.goods < cap(t) && S.cash >= buyPrice(t.good);
      const canCap    = t.capLvl   < capTab(t).length && S.cash >= capCost(t);
      const canSales  = t.salesLvl < salTab(t).length && S.cash >= salesCost(t);
      return canGoods || canCap || canSales;
    }
    return true;
  }catch(e){ return true; }                        // при любой неожиданности не сереем
}

function showOnboarding(){
  return new Promise(resolve => {
    document.getElementById('onboard')?.remove();
    const root = document.createElement('div');
    root.id = 'onboard'; root.setAttribute('role','dialog'); root.setAttribute('aria-modal','true');
    root.setAttribute('aria-label','Как играть');
    const goal = (typeof CFG!=='undefined') ? `Цель — 🎫 ${CFG.TICKET_PTS} очков за ${CFG.DAYS} дней. Набрал — билет в Россию твой.` : '';
    root.innerHTML = `<div class="ob-card">
      <button class="ob-skip" type="button">Пропустить</button>
      <div class="ob-track">${ONBOARD_SLIDES.map((s,i)=>`
        <section class="ob-slide" data-i="${i}" aria-hidden="${i?'true':'false'}">
          <div class="ob-step">Шаг ${i+1} из ${ONBOARD_SLIDES.length}</div>
          <div class="ob-art">${s.art}</div>
          <h2 class="ob-title">${s.title}</h2>
          <p class="ob-text">${s.text}</p>
          ${s.goal?`<p class="ob-goal">${goal}</p>`:''}
        </section>`).join('')}</div>
      <div class="ob-dots">${ONBOARD_SLIDES.map((_,i)=>`<i data-i="${i}"></i>`).join('')}</div>
      <button class="ob-next bad" type="button">Дальше</button>
    </div>`;
    document.body.append(root);
    const slides=[...root.querySelectorAll('.ob-slide')], dots=[...root.querySelectorAll('.ob-dots i')];
    const next=root.querySelector('.ob-next');
    let at=0;
    const show=i=>{
      at=Math.max(0,Math.min(slides.length-1,i));
      slides.forEach((s,k)=>{s.classList.toggle('on',k===at);s.setAttribute('aria-hidden',String(k!==at));});
      dots.forEach((d,k)=>d.classList.toggle('on',k===at));
      next.textContent = at===slides.length-1 ? 'Поехали!' : 'Дальше';
    };
    const finish=()=>{ root.classList.add('out'); setTimeout(()=>{root.remove();resolve();},220); };
    next.onclick=()=> at===slides.length-1 ? finish() : show(at+1);
    root.querySelector('.ob-skip').onclick=finish;
    dots.forEach(d=>d.onclick=()=>show(+d.dataset.i));
    // свайп влево/вправо
    let x0=null;
    root.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
    root.addEventListener('touchend',e=>{
      if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null;
      if(Math.abs(dx)>40) show(at+(dx<0?1:-1));
    });
    if(typeof enamelButton==='function') enamelButton(next);
    show(0);
    requestAnimationFrame(()=>root.classList.add('in'));
  });
}

// Игровые деньги в HUD показаны пачкой купюр, а не знаком доллара.
// Ставим ту же иконку рядом с ценой. Рубли за реальные покупки не трогаем.
function cashGlyph(root){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const hits=[];
  while(walker.nextNode()){
    const node=walker.currentNode;
    if(node.parentElement.closest('.enamel-skin'))continue;
    if(node.nodeValue.includes('$'))hits.push(node);
  }
  for(const node of hits){
    const parts=node.nodeValue.split('$');
    const frag=document.createDocumentFragment();
    frag.append(parts[0]);
    for(let i=1;i<parts.length;i++){
      const ic=document.createElement('i');
      ic.className='cash-glyph';ic.setAttribute('aria-hidden','true');
      frag.append(ic,parts[i]);
    }
    node.replaceWith(frag);
  }
}

      closeModal();
    };
    footer.append(half); enamelButton(half);
  }
  const canBuy=rows.some(r=>!r.querySelector('button').disabled);
  const note=document.createElement('small');note.className='warehouse-buy-note';note.textContent=canBuy?'Тап: +1 товар. Удерживай, чтобы покупать быстрее.':rows.every(r=>+r.querySelector('.ring').getAttribute('aria-valuenow')>=+r.querySelector('.ring').getAttribute('aria-valuemax'))?'Все точки заполнены. Товар готов к продаже или поставке.':'Не хватает денег на закупку.';footer.append(note);
 }else{
  const done=document.createElement('button');done.className='sec';done.textContent='На карту';done.onclick=()=>closeModal();footer.append(done);enamelButton(done);
 }
 const shell=document.createElement('div');shell.className='warehouse-shell';shell.append(head,list,footer);card.replaceChildren(shell,close);paintedClose(close);
 rows.forEach(r=>enamelButton(r.querySelector('button')));
 list.scrollTop=warehouseScroll;list.addEventListener('scroll',()=>warehouseScroll=list.scrollTop,{passive:true});
}
new MutationObserver(()=>{if($('modal').hidden){warehouseScroll=0;warehouseStocks={};}}).observe($('modal'),{attributes:true,attributeFilter:['hidden']});

/* Fast physical paper motion. Game promises never wait for decorative motion. */
const PaperMotion=(()=>{
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 const running=new Map();
 const time={enter:220,small:180,exit:130};
 function stop(el){const a=running.get(el);if(a){a.cancel();running.delete(el);}el?.removeAttribute('data-paper-moving');}
 function play(el,kind='card',exit=false){
  if(!el)return null;
  const previous=running.has(el)?getComputedStyle(el):null;
  const previousTransform=previous?.transform,previousOpacity=previous?.opacity;
  stop(el);
  if(reduced.matches||CFG.SPEED>=100)return null;
  const cs=getComputedStyle(el),base=cs.transform==='none'?'':cs.transform;
  const small=kind==='small',duration=exit?time.exit:small?time.small:time.enter;
  const pose=(y,x,z,s)=>`${base} perspective(1000px) translate3d(0,${y}px,0) rotateX(${x}deg) rotateZ(${z}deg) scale(${s})`;
  const frames=exit?[
   {transform:previousTransform||pose(0,0,0,1),opacity:previousOpacity||1,offset:0},
   {transform:pose(-3,-2,.45,1.012),opacity:1,offset:.2},
   {transform:pose(small?-22:42,small?5:-9,small?-1.4:1.8,.95),opacity:0,offset:1}
  ]:[
   {transform:pose(small?-22:48,small?-9:13,small?1.5:-2.2,.93),opacity:0,offset:0},
   {transform:pose(-3,-1.4,.4,1.012),opacity:1,offset:.7},
   {transform:pose(0,0,0,1),opacity:1,offset:1}
  ];
  const a=el.animate(frames,{duration,easing:exit?'cubic-bezier(.4,0,.8,.4)':'cubic-bezier(.16,.78,.24,1)',fill:exit?'forwards':'none'});
  a.id=exit?'paper-exit':'paper-enter';running.set(el,a);el.dataset.paperMoving=exit?'out':'in';
  a.finished.then(()=>{if(running.get(el)!==a)return;if(!exit)stop(el);},()=>{});
  return a;
 }
 function enter(el,kind){return play(el,kind);}
 function leave(el,done,kind,hold=false){
  const a=play(el,kind,true);
  if(!a){done();return;}
  a.finished.then(()=>{if(running.get(el)===a){done();if(!hold)stop(el);}},()=>{});
 }
 reduced.addEventListener('change',()=>{if(reduced.matches)for(const a of running.values())a.finish();});
 return {enter,leave,stop,time};
})();

const paperOriginalModal=modal,paperOriginalCustom=openCustom,paperOriginalClose=closeModal;
modal=function(...args){const p=paperOriginalModal(...args);PaperMotion.enter($('card'));return p;};
openCustom=function(...args){const p=paperOriginalCustom(...args);PaperMotion.enter($('card'));return p;};
closeModal=function(value){
 const visible=!$('modal').hidden&&!$('modal').classList.contains('closing');
 if(!visible)return;
 paperOriginalClose(value);
 if(!$('modal').hidden)PaperMotion.leave($('card'),()=>{},'card',true);
};
// Stop a retained exit when the original 150 ms modal cleanup hides the shell.
new MutationObserver(()=>{if($('modal').hidden)PaperMotion.stop($('card'));}).observe($('modal'),{attributes:true,attributeFilter:['hidden']});

const paperOriginalHelp=openHelp;
let paperHelpClosing=false;
openHelp=function(...args){
 const dlg=$('helpDialog');
 if(paperHelpClosing){PaperMotion.stop(dlg);dlg.close();paperHelpClosing=false;dlg.inert=false;}
 const wasOpen=dlg.open,p=paperOriginalHelp(...args);
 if(!wasOpen&&dlg.open)PaperMotion.enter(dlg);
 return p;
};
closeHelp=function(){
 const dlg=$('helpDialog');if(!dlg.open||paperHelpClosing)return;
 const resolve=helpResolve;helpResolve=null;const focus=helpFocus;
 paperHelpClosing=true;dlg.inert=true;
 PaperMotion.leave(dlg,()=>{dlg.close();dlg.inert=false;paperHelpClosing=false;if(focus?.isConnected)focus.focus();});
 if(resolve)resolve();
};
$('helpClose').onclick=closeHelp;

const paperOriginalTip=showTip,paperOriginalHideTip=hideTip;
let paperTipClosing=false;
showTip=function(...args){
 if($('helpDialog').open)return;
 PaperMotion.stop($('tip'));paperTipClosing=false;$('tip').style.pointerEvents='';
 paperOriginalTip(...args);PaperMotion.enter($('tip'),'small');
};
hideTip=function(){
 const el=$('tip');if(el.hidden||paperTipClosing)return;
 clearTimeout(tipT);paperTipClosing=true;el.style.pointerEvents='none';
 // Free the world immediately; only the departing paper remains for 130 ms.
 document.body.classList.remove('coach-tip-open');
 PaperMotion.leave(el,()=>{paperOriginalHideTip();paperTipClosing=false;el.style.pointerEvents='';},'small');
};
$('tip').onclick=hideTip;

// Notifications are reused by the game; observe visibility, not every text mutation.
const paperToast=$('toast');let paperToastVisible=false;
new MutationObserver(()=>{
 const shown=paperToast.style.opacity==='1';if(shown===paperToastVisible)return;paperToastVisible=shown;
 if(shown)PaperMotion.enter(paperToast,'small');else PaperMotion.leave(paperToast,()=>{},'small');
}).observe(paperToast,{attributes:true,attributeFilter:['style']});

// Tabs exchange one sheet. Stock, price and reward redraws leave the sheet still.
$('card').addEventListener('click',e=>{
 if(e.target.closest('[data-tab]'))PaperMotion.enter($('card'));
});
function dismissPaperOffer(layer,after){
 if(layer.inert)return;layer.inert=true;
 PaperMotion.leave(layer.querySelector('.pass-offer-paper'),()=>{
  const current=layer.isConnected&&!$('modal').classList.contains('closing');layer.remove();
  if(current){if(after)after();else $('bpBuy')?.focus();}
 });
}

if(!load())newGame();else if(S.finished)newGame();else if(!S.player)setTimeout(()=>askName(),50);
S.sessions=(S.sessions||0)+1;track('session_start',{sessions:S.sessions,v:VERSION,cfg:cfgHash(),startV:S.startVersion||null});
fit();{const[g1,g2]=gridOf(S.pos);const[x,y]=iso(g1,g2);cam={x,y:y-TH*0.4};}render();
</script>
