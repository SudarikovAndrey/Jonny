<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="engine.png"><title>Бруклин · стыковка 3D и рисунка</title><style>
*{box-sizing:border-box}body{margin:0;background:#181b1d;color:#f1e4c9;font:15px/1.4 Arial,sans-serif}header{padding:16px 22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;border-bottom:1px solid #4b514f}h1{font-size:19px;margin:0}small{color:#c5c2b9}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 22px}button,select{font:inherit;color:inherit;background:#323937;border:1px solid #59625d;border-radius:7px;padding:9px 12px;cursor:pointer}button[aria-pressed=true]{background:#145b64;border-color:#38dce7}button:focus-visible,select:focus-visible{outline:2px solid #f1c455}label{display:flex;align-items:center;gap:6px}main{position:relative;width:min(100vw,1536px);aspect-ratio:3/2;margin:0 auto;background:#292b27}iframe{width:100%;height:100%;border:0;display:block}#drag{position:absolute;inset:0;touch-action:none;cursor:grab}footer{padding:12px 22px;display:flex;gap:22px;flex-wrap:wrap}#status{color:#b5e0bf}.cyan{color:#38dce7}.pink{color:#ff759e}a{color:#e8c875}#loading{position:absolute;inset:0;display:grid;place-content:center;background:#252824}body.ready #loading{display:none}@media(max-width:700px){header,nav,footer{padding:10px}h1{font-size:16px}}
</style><header><div><h1>Стыковка 3D и рисунка</h1><small>Тот же фон, камера и физика, что в игре. Сохранение игрока не используется.</small></div><a href="/?ui=19">Вернуться в игру</a></header><nav>
<button data-mode="art">Рисунок</button><button data-mode="physics" aria-pressed="true">Коллайдеры</button><button data-mode="occlusion">Перекрытие</button>
<label><input id="tiles" type="checkbox" checked>Клетки</label><label><input id="labels" type="checkbox">Названия</label>
<button id="zoomIn">＋</button><button id="zoomOut">−</button><button id="reset">Всё поле</button>
<select id="object"><option>Warehouse</option><option>CityBank</option><option>Diner</option><option>FishMarket</option><option>GasCanopy</option><option>GasStation</option><option>CratesSouth</option><option>CratesNorth</option><option>WaterTower</option><option>TreeNorth</option><option>TreeEast</option><option>TreeWarehouse</option><option>LampCenter</option><option>Pipes</option><option>Forklift</option><option>NorthBuildingFront</option></select><button id="focus">Приблизить объект</button><button id="front">Кубик перед</button><button id="behind">Кубик за</button><button id="drop">Бросить на объект</button>
</nav><main><iframe src="engine.html?v=19" title="3D-объёмы поверх карты"></iframe><div id="drag"></div><div id="loading">Загружаем сцену…</div></main><footer><span class="cyan">Голубой — физические объёмы без обрезки маской</span><span class="pink">Розовый — маска перекрытия с учётом глубины</span><span>Перетащи карту · колесо — масштаб</span><span id="status">Выбери объект для проверки кубиками</span></footer>
<script>
let mode='physics',width=19.05,callback,drag;
const send=data=>callback?.(JSON.stringify(data));
window.MobileHost={ready:false,feedback(){},progress(){},failed(m){document.querySelector('#loading').textContent=m},positions(){},diceDone(){},diceResult(){},stepDone(){},
sceneReady(fn){callback=fn;this.ready=true;document.body.classList.add('ready');update(true)},
frameState(json){this.sceneState=JSON.parse(json);const hits=[...new Set(this.sceneState.contacts?.flat()||[])];if(hits.length)document.querySelector('#status').textContent='Столкновения: '+hits.join(', ')}};
function update(reset=false){send({action:'layout',top:0,bottom:0});send({action:'audit',width,tiles:document.querySelector('#tiles').checked,reset});send({action:'debug',on:mode!=='art',occlusion:mode==='occlusion',labels:document.querySelector('#labels').checked});document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;update()});
for(const id of ['tiles','labels'])document.getElementById(id).onchange=()=>update();
document.querySelector('#zoomIn').onclick=()=>{width=Math.max(4,width/1.3);update()};document.querySelector('#zoomOut').onclick=()=>{width=Math.min(23,width*1.3);update()};document.querySelector('#reset').onclick=()=>{width=19.05;update(true)};
document.querySelector('#focus').onclick=()=>{width=6;send({action:'audit_focus',name:document.querySelector('#object').value,width})};
for(const id of ['front','behind'])document.getElementById(id).onclick=()=>send({action:'audit_probe',name:document.querySelector('#object').value,behind:id==='behind'});
document.querySelector('#drop').onclick=()=>{document.querySelector('#status').textContent='Кубики падают…';send({action:'audit_drop',name:document.querySelector('#object').value})};
const surface=document.querySelector('#drag');surface.onpointerdown=e=>{drag=[e.clientX,e.clientY];surface.setPointerCapture(e.pointerId)};surface.onpointermove=e=>{if(!drag)return;send({action:'pan',dx:e.clientX-drag[0],dy:e.clientY-drag[1],input_width:surface.clientWidth});drag=[e.clientX,e.clientY]};surface.onpointerup=surface.onpointercancel=()=>drag=null;surface.onwheel=e=>{e.preventDefault();if(e.ctrlKey||e.metaKey){width=Math.max(4,Math.min(23,width*Math.exp(Math.max(-120,Math.min(120,e.deltaY))*.008)));update()}else{const u=e.deltaMode===1?16:e.deltaMode===2?surface.clientHeight:1;send({action:'pan',dx:-e.deltaX*u,dy:-e.deltaY*u,input_width:surface.clientWidth})}};
</script></html>
